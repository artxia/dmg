name: Build and Release
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:

jobs:
  build:
    name: macos - build ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - build: macos-universal
            os: macos-latest
            rust: stable
            tauri_target: universal-apple-darwin
          - build: macos-intel
            os: macos-latest
            rust: stable
            tauri_target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          # target will be added explicitly in steps below

      - name: Rust cache restore
        id: cache_store
        uses: actions/cache/restore@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '10' # 或你需要的 pnpm 版本
      
      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile --prefer-frozen-lockfile

      - name: Prepare Rust targets for universal build
        if: matrix.build == 'macos-universal'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Prepare Rust target for intel build
        if: matrix.build == 'macos-intel'
        run: |
          rustup target add x86_64-apple-darwin

      - name: Build for macOS (universal)
        if: matrix.build == 'macos-universal'
        run: |
          # build universal macOS bundle (includes both arm64 and x86_64)
          npm run tauri build -- --target universal-apple-darwin
          mkdir -p output/macos/universal
          # move any produced dmg(s) into output directory and include title if provided
          mv src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg output/macos/universal/"${{ inputs.title || github.ref_name || 'multica' }}".dmg || true

      - name: Build for macOS (intel)
        if: matrix.build == 'macos-intel'
        run: |
          # build x86_64-only macOS bundle (Intel)
          npm run tauri build -- --target x86_64-apple-darwin
          mkdir -p output/macos/intel
          mv src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg output/macos/intel/"${{ inputs.title || github.ref_name || 'multica' }}".dmg || true

      - name: Rust cache store
        uses: actions/cache/save@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Upload For Single Build
        uses: actions/upload-artifact@v4
        # when not creating a tag release, upload intermediate artifacts
        if: startsWith(github.ref, 'refs/tags/') != true
        with:
          path: 'output/*/*.*'

      - name: Upload For Release
        # arg info: https://github.com/ncipollo/release-action#release-action
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/') == true
        with:
          allowUpdates: true
          artifacts: 'output/*/*.*'
          token: ${{ secrets.GITHUB_TOKEN }}
