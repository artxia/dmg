name: Build and Release
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:

jobs:
  build:
    name: macos - build ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - build: macos-universal
            os: macos-15
            rust: stable
            tauri_target: universal-apple-darwin
          - build: macos-intel
            os: macos-15
            rust: stable
            tauri_target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '10'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Rust cache restore
        id: cache_store
        uses: actions/cache/restore@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Prepare Rust targets for universal build
        if: matrix.build == 'macos-universal'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Prepare Rust target for intel build
        if: matrix.build == 'macos-intel'
        run: |
          rustup target add x86_64-apple-darwin

      - name: Build for macOS (universal)
        if: matrix.build == 'macos-universal'
        run: |
          # Try to run tauri in the files package (fallback to run if exec not found)
          set -e
          echo "Attempting pnpm --dir files exec tauri ..."
          if pnpm --dir files exec tauri -- --version >/dev/null 2>&1; then
            pnpm --dir files exec tauri build -- --target ${TAURI_TARGET:-universal-apple-darwin}
          elif pnpm --dir files run tauri -- --version >/dev/null 2>&1; then
            pnpm --dir files run tauri -- --target ${TAURI_TARGET:-universal-apple-darwin}
          else
            echo "tauri not found in files/ package. Printing files/package.json for debugging:"
            [ -f files/package.json ] && cat files/package.json || true
            echo "You may need to install tauri in the files package or adjust the package path."
            exit 1
          fi
          mkdir -p output/macos/universal
          # Move produced dmgs from files/src-tauri (adjust if src-tauri is at repo root or other subdir)
          mv files/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg output/macos/universal/"${{ inputs.title || github.ref_name || 'multica' }}".dmg || true

      - name: Build for macOS (intel)
        if: matrix.build == 'macos-intel'
        run: |
          set -e
          echo "Attempting pnpm --dir files exec tauri ..."
          if pnpm --dir files exec tauri -- --version >/dev/null 2>&1; then
            pnpm --dir files exec tauri build -- --target ${TAURI_TARGET:-x86_64-apple-darwin}
          elif pnpm --dir files run tauri -- --version >/dev/null 2>&1; then
            pnpm --dir files run tauri -- --target ${TAURI_TARGET:-x86_64-apple-darwin}
          else
            echo "tauri not found in files/ package. Printing files/package.json for debugging:"
            [ -f files/package.json ] && cat files/package.json || true
            exit 1
          fi
          mkdir -p output/macos/intel
          mv files/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg output/macos/intel/"${{ inputs.title || github.ref_name || 'multica' }}".dmg || true

      - name: Rust cache store
        uses: actions/cache/save@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Upload For Single Build
        uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') != true
        with:
          path: 'output/*/*.*'

      - name: Upload For Release
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/') == true
        with:
          allowUpdates: true
          artifacts: 'output/*/*.*'
          token: ${{ secrets.GITHUB_TOKEN }}
