name: Build Intel macOS Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version, without leading v. Example: 0.1.0-beta.1"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-intel:
    name: Build & Package Intel macOS
    runs-on: macos-26-intel
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        run: |
          set -euo pipefail

          INPUT_VERSION="${{ inputs.version }}"

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 2
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DIST_DIR=dist/build/$VERSION" >> "$GITHUB_ENV"

          echo "Resolved version: $VERSION"

      - name: Show toolchain
        run: |
          set -euo pipefail
          uname -a
          uname -m
          xcodebuild -version
          swift --version

      - name: Prepare Intel package-only release scripts
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          # 1. Allow dist/build-release.sh to run on Intel.
          p = Path("dist/build-release.sh")
          text = p.read_text()
          old = '''if [ "$(uname -m)" != "arm64" ]; then
              echo "REFUSED: the first public binary release is defined as Apple-silicon only" >&2
              exit 2
          fi
          '''
          if old not in text:
              raise SystemExit("Could not find arm64 guard in dist/build-release.sh")
          text = text.replace(old, '''echo "Intel package-only release override enabled: $(uname -m)"
          ''')
          p.write_text(text)

          # 2. Skip runtime tests during GitHub Actions packaging.
          # GitHub Actions has no real Bluetooth/TCC/user audio environment.
          p = Path("mic/driver/build.sh")
          text = p.read_text()
          text = text.replace(
              '"./srm_driver_contract_test" "$DRIVER/Contents/MacOS/$EXE"',
              'echo "! CI packaging: skipped srm_driver_contract_test"'
          )
          text = text.replace(
              '"./srm_io_sim" "$DRIVER/Contents/MacOS/$EXE"',
              'echo "! CI packaging: skipped srm_io_sim"'
          )
          p.write_text(text)

          # 3. Make upstream release audit expect Intel artifacts and binaries.
          p = Path("dist/audit-release.sh")
          text = p.read_text()
          text = text.replace(
              'HyperVibe-$VERSION-macOS-arm64.zip',
              'HyperVibe-$VERSION-macOS-x86_64.zip'
          )
          text = text.replace(
              'HyperVibe-Full-Setup-$VERSION-arm64.zip',
              'HyperVibe-Full-Setup-$VERSION-x86_64.zip'
          )
          text = text.replace(
              '[ "$(/usr/bin/lipo -archs "$binary")" = "arm64" ]',
              '[ "$(/usr/bin/lipo -archs "$binary")" = "x86_64" ]'
          )
          text = text.replace('non-arm64 shipping binary', 'non-x86_64 shipping binary')
          p.write_text(text)
          PY

      - name: Build Intel release packages
        env:
          HYPERVIBE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          if [ "$(uname -m)" != "x86_64" ]; then
            echo "Expected Intel runner, got: $(uname -m)"
            exit 1
          fi

          echo "Building HyperVibe Intel release assets for $VERSION"
          HYPERVIBE_ALLOW_DIRTY=1 dist/build-release.sh "$VERSION"

          echo "Build complete"

      - name: Verify Intel release assets
        run: |
          set -euo pipefail

          APP_ZIP="$DIST_DIR/HyperVibe-$VERSION-macOS-x86_64.zip"
          FULL_ZIP="$DIST_DIR/HyperVibe-Full-Setup-$VERSION-x86_64.zip"
          SUMS="$DIST_DIR/SHA256SUMS.txt"

          for file in "$APP_ZIP" "$FULL_ZIP" "$SUMS"; do
            if [ ! -f "$file" ]; then
              echo "Missing release asset: $file"
              exit 1
            fi
          done

          cd "$DIST_DIR"
          shasum -a 256 -c SHA256SUMS.txt

          TMP_DIR="$(mktemp -d)"
          unzip -q "$(basename "$APP_ZIP")" -d "$TMP_DIR"

          APP_BIN="$(find "$TMP_DIR" -path "*/HyperVibe.app/Contents/MacOS/HyperVibe" -type f | head -n 1)"
          if [ -z "$APP_BIN" ]; then
            echo "HyperVibe binary not found in app zip"
            exit 1
          fi

          echo "App binary:"
          file "$APP_BIN"
          lipo -archs "$APP_BIN"

          if [ "$(lipo -archs "$APP_BIN")" != "x86_64" ]; then
            echo "HyperVibe binary is not x86_64"
            exit 1
          fi

          echo "Release assets:"
          ls -lh *.zip SHA256SUMS.txt

      - name: Upload artifacts for manual run
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: HyperVibe-${{ env.VERSION }}-macOS-x86_64
          path: |
            ${{ env.DIST_DIR }}/*.zip
            ${{ env.DIST_DIR }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.DIST_DIR }}/*.zip
            ${{ env.DIST_DIR }}/SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          generate_release_notes: true
