name: Build and Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    name: macos-latest
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install npm deps
        run: npm ci

      - name: Add macOS Rust targets
        run: |
          rustup target add aarch64-apple-darwin || true
          rustup target add x86_64-apple-darwin || true

      - name: Build for macOS (Tauri universal)
        env:
          CI: true
        run: |
          # If you want to force building universal, the tauri bundler will build both targets
          npm run tauri build -- --target universal-apple-darwin

          # collect the produced DMG into a stable output folder named with the ref (tag or branch)
          mkdir -p output/macos
          if [ -d "src-tauri/target/universal-apple-darwin/release/bundle/dmg" ]; then
            mv src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg output/macos/"${{ github.ref_name }}".dmg || true
          else
            echo "No DMG found at expected path; listing src-tauri/target:"
            ls -la src-tauri/target || true
            exit 1
          fi

      - name: Upload artifact (non-tag runs)
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: output/*/*.*

      - name: Create or update GitHub Release (tag runs)
        if: startsWith(github.ref, 'refs/tags/') == true
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: 'output/*/*.*'
          token: ${{ secrets.GITHUB_TOKEN }}
