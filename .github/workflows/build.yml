name: Build and Release
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:

jobs:
  build-macos:
    name: Build macOS (apps/desktop)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '10'

      - name: Install dependencies (pnpm)
        run: |
          set -e
          pnpm install --frozen-lockfile || pnpm install

      - name: Build apps/desktop (x64)
        env:
          CI: true
        run: |
          set -ex
          TAURI_DIR="apps/desktop"
          ARCH_DIR="output/macos/x64"
          mkdir -p "$ARCH_DIR"
          # build x64
          pnpm --dir "$TAURI_DIR" run package -- --mac --x64 --publish never
          # move any produced .dmg into arch-specific output dir
          find "$TAURI_DIR" -type f -name '*.dmg' -maxdepth 6 -exec mv -f {} "$ARCH_DIR"/ \; || true
          echo "x64 artifacts:"
          ls -la "$ARCH_DIR" || true

      - name: Build apps/desktop (arm64)
        env:
          CI: true
        run: |
          set -ex
          TAURI_DIR="apps/desktop"
          ARCH_DIR="output/macos/arm64"
          mkdir -p "$ARCH_DIR"
          # build arm64
          pnpm --dir "$TAURI_DIR" run package -- --mac --arm64 --publish never
          # move any produced .dmg into arch-specific output dir
          find "$TAURI_DIR" -type f -name '*.dmg' -maxdepth 6 -exec mv -f {} "$ARCH_DIR"/ \; || true
          echo "arm64 artifacts:"
          ls -la "$ARCH_DIR" || true

      - name: Upload For Single Build
        uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') != true
        with:
          path: 'output/**/*.dmg'

      - name: Upload For Release
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/') == true
        with:
          allowUpdates: true
          artifacts: 'output/**/*.dmg'
          token: ${{ secrets.GITHUB_TOKEN }}
