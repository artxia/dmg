name: Build and Release
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:

jobs:
  build-macos:
    name: Build macOS (apps/desktop)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '10'

      - name: Install dependencies (pnpm)
        run: |
          set -e
          pnpm install --frozen-lockfile || pnpm install

      - name: Build apps/desktop (electron package)
        env:
          CI: true
        run: |
          set -ex
          # 硬编码桌面包目录
          TAURI_DIR="apps/desktop"
          # 调用项目内的打包脚本：node scripts/package.mjs -> electron-vite + electron-builder
          # 使用 --mac --universal 构建 macOS 通用包（根据需要可改为 --mac --x64 或其它）
          pnpm --dir "$TAURI_DIR" run package -- --mac --universal
          # 收集生成的 .dmg（把找到的 .dmg 移到统一 output 目录）
          mkdir -p output/macos
          find "$TAURI_DIR" -type f -name '*.dmg' -exec mv {} output/macos/ \; || true
          echo "Artifacts in output/macos:"
          ls -la output/macos || true

      - name: Upload For Single Build
        uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') != true
        with:
          path: 'output/*/*.*'

      - name: Upload For Release
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/') == true
        with:
          allowUpdates: true
          artifacts: 'output/*/*.*'
          token: ${{ secrets.GITHUB_TOKEN }}
