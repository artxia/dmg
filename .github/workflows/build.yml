name: Build Intel macOS DMG

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-intel:
    name: Build & Package Intel DMG
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Swift app for x86_64
        run: |
          set -euo pipefail
          
          # Configuration
          APP_NAME="Vorssaint"
          EXECUTABLE="Vorssaint"
          TARGET="x86_64-apple-macosx14.0"
          ENTITLEMENTS="Resources/Vorssaint.entitlements"
          
          echo "▸ Compiling (release) for x86_64…"
          rm -rf build
          mkdir -p build
          
          # Prefer macOS 26 SDK when available
          PINNED_SDK="/Library/Developer/CommandLineTools/SDKs/MacOSX26.sdk"
          if [[ -d "$PINNED_SDK" ]]; then
              SDK="$PINNED_SDK"
          else
              SDK="$(xcrun --show-sdk-path)"
          fi
          echo "Using SDK: $(basename "$SDK")"
          
          # Compile Swift sources
          swiftc -O -target "$TARGET" -sdk "$SDK" \
              Sources/Vorssaint/**/*.swift \
              -o "build/$EXECUTABLE"
          
          if [ ! -f "build/$EXECUTABLE" ]; then
              echo "✗ Compilation failed: executable not found"
              exit 1
          fi
          echo "✓ Compilation successful"
          
          # Store variables in environment for next steps
          echo "SWIFT_TARGET=$TARGET" >> $GITHUB_ENV
          echo "SWIFT_EXECUTABLE=$EXECUTABLE" >> $GITHUB_ENV
          echo "SWIFT_APP_NAME=$APP_NAME" >> $GITHUB_ENV

      - name: Generate app icon
        run: |
          set -euo pipefail
          echo "▸ Generating app icon…"
          swift Tools/MakeIcon.swift build/AppIcon.iconset
          xattr -c -r build/AppIcon.iconset build/AppIcon.icns build/MenuBarIcon.png build/MenuBarIcon@2x.png build/BrandMark.png 2>/dev/null || true
          echo "✓ Icon generation complete"

      - name: Assemble app bundle
        run: |
          set -euo pipefail
          echo "▸ Assembling app bundle…"
          
          APP_NAME="${{ env.SWIFT_APP_NAME }}"
          EXECUTABLE="${{ env.SWIFT_EXECUTABLE }}"
          
          # Create temporary staging directory
          STAGE="$(mktemp -d)/$APP_NAME.app"
          mkdir -p "$STAGE/Contents/MacOS" "$STAGE/Contents/Resources"
          
          # Copy executable
          cp "build/$EXECUTABLE" "$STAGE/Contents/MacOS/$EXECUTABLE"
          
          # Copy bundle metadata
          cp Resources/Info.plist "$STAGE/Contents/Info.plist"
          
          # Copy resources
          cp CHANGELOG.md "$STAGE/Contents/Resources/CHANGELOG.md" 2>/dev/null || true
          
          # Copy localization bundles (lproj directories)
          for lproj in Resources/*.lproj; do
              if [ -d "$lproj" ]; then
                  cp -R "$lproj" "$STAGE/Contents/Resources/"
              fi
          done
          
          # Write PkgInfo
          printf 'APPL????' > "$STAGE/Contents/PkgInfo"
          
          # Copy icon assets
          cp build/AppIcon.icns "$STAGE/Contents/Resources/AppIcon.icns"
          cp build/MenuBarIcon.png build/MenuBarIcon@2x.png build/BrandMark.png "$STAGE/Contents/Resources/"
          
          # Copy optional assets
          if [ -f Resources/Gifs/dockPreview.gif ]; then
              mkdir -p "$STAGE/Contents/Resources/Gifs"
              cp Resources/Gifs/dockPreview.gif "$STAGE/Contents/Resources/Gifs/"
          fi
          
          if [ -d Resources/Images ]; then
              mkdir -p "$STAGE/Contents/Resources/Images"
              cp Resources/Images/* "$STAGE/Contents/Resources/Images/"
          fi
          
          # Clean extended attributes
          xattr -c -r "$STAGE" 2>/dev/null || true
          
          # Copy to build/stage for DMG creation
          mkdir -p "build/stage"
          BUILD_STAGE="build/stage/$APP_NAME.app"
          rm -rf "$BUILD_STAGE"
          ditto --noextattr --noqtn "$STAGE" "$BUILD_STAGE"
          xattr -c -r "$BUILD_STAGE" 2>/dev/null || true
          
          echo "✓ Bundle assembled: $BUILD_STAGE"
          echo "BUILD_STAGE=$BUILD_STAGE" >> $GITHUB_ENV

      - name: Create DMG
        run: |
          set -euo pipefail
          
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
              VERSION="dev"
          fi
          
          APP_NAME="${{ env.SWIFT_APP_NAME }}"
          BUILD_STAGE="${{ env.BUILD_STAGE }}"
          
          mkdir -p dist
          DMG_FILE="dist/Vorssaint-${VERSION}-intel-x86_64.dmg"
          
          echo "▸ Creating DMG…"
          
          # Create a staging directory for DMG contents
          TEMP_DMG_STAGE=$(mktemp -d)
          cp -R "$BUILD_STAGE" "$TEMP_DMG_STAGE/"
          xattr -c -r "$TEMP_DMG_STAGE" 2>/dev/null || true
          
          # Create DMG using hdiutil
          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$TEMP_DMG_STAGE" \
            -ov \
            -format UDZO \
            "$DMG_FILE"
          
          if [ -f "$DMG_FILE" ]; then
              echo "✓ DMG created successfully"
              ls -lh "$DMG_FILE"
              echo "DMG_FILE=$DMG_FILE" >> $GITHUB_ENV
          else
              echo "✗ Failed to create DMG"
              exit 1
          fi
          
          rm -rf "$TEMP_DMG_STAGE"

      - name: Verify DMG
        run: |
          set -euo pipefail
          
          DMG_FILE="${{ env.DMG_FILE }}"
          
          if [ -f "$DMG_FILE" ]; then
              echo "✓ DMG file exists"
              file "$DMG_FILE"
              du -h "$DMG_FILE"
          else
              echo "✗ DMG file not found"
              exit 1
          fi

      - name: Upload artifacts (manual workflow run)
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: macos-intel-dmg
          path: dist/*.dmg
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
