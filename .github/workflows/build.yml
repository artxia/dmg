name: Build and Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build-macos-intel:
    name: Build macOS (Intel)
    runs-on: macos-26
    env:
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make build scripts executable
        run: |
          chmod +x ./run-self-tests.sh || true
          chmod +x ./package-app.sh || true
          chmod +x ./build-dmg.sh || true
          chmod +x ./build-pkg.sh || true

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Package.resolved') }}

      - name: Show system info (debug)
        run: |
          sw_vers
          xcodebuild -version || true
          swift --version

      - name: Run self-tests
        run: zsh ./run-self-tests.sh

      - name: Build DMG (calls package-app.sh)
        run: zsh ./build-dmg.sh

      - name: Show built artifacts
        run: |
          ls -la dist || true
          ls -la dist/*.dmg || true

      - name: Upload artifact (non-tag runs)
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: actions/upload-artifact@v4
        with:
          name: vremoter-dmg
          path: dist/*.dmg

      - name: Create or update GitHub Release (tag runs)
        if: startsWith(github.ref, 'refs/tags/') == true
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: 'dist/*.dmg'
          token: ${{ secrets.GITHUB_TOKEN }}
